server:
  port: ${PORT:8080}
  compression:
    enabled: true
  # Ni el detalle del error ni el rastro de la excepcion salen hacia el visitante.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: deepservice
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:mem:deepservice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: "0"
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 31536000
          cache-public: true

jwt:
  # Obligatorio en produccion: JWT_SECRET (generar con: openssl rand -base64 48).
  # Sin valor el servidor usa una clave aleatoria que cambia en cada reinicio (cierra las sesiones).
  secret: ${JWT_SECRET:}
  # Duracion de la sesion: 8 horas.
  expiration: ${JWT_EXPIRATION:28800000}

app:
  admin:
    # Codigo que deben presentar los administradores para registrarse. Sin valor,
    # el registro queda cerrado. Generar con: openssl rand -base64 24
    registro-codigo: ${ADMIN_REGISTRO_CODIGO:}
    # Cuenta inicial opcional (se crea una sola vez, solo si ambos tienen valor).
    inicial-correo: ${ADMIN_INICIAL_CORREO:}
    inicial-clave: ${ADMIN_INICIAL_CLAVE:}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    cl.deepservice: ${LOG_LEVEL:INFO}
