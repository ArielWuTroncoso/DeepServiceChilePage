server:
  port: ${PORT:8080}
  compression:
    enabled: true

spring:
  application:
    name: deepservice
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:mem:deepservice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: "0"
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 31536000
          cache-public: true

jwt:
  # En produccion inyectar JWT_SECRET. Generar con: openssl rand -base64 48
  secret: ${JWT_SECRET:6B59703373367639792F423F4528482B4D6251655468576D5A7134743777217A}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    cl.deepservice: ${LOG_LEVEL:INFO}
