# ============================================================================
# Deep Service Chile - Despliegue en Render con DOS servicios,
# igual que el proyecto Abrazamente: un backend y un frontend separados.
#
# Tras el primer deploy hay que cruzar las URLs:
#   - En el backend  -> FRONTEND_ORIGINS = URL publica del frontend
#   - En el frontend -> VITE_API_URL     = URL publica del backend
# ============================================================================
services:

  # --------------------------------------------------------------------
  # 1) Backend: API REST Spring Boot + PostgreSQL
  # --------------------------------------------------------------------
  - type: web
    name: deep-service-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /api/salud
    envVars:
      - key: DB_URL
        sync: false   # jdbc:postgresql://HOST:5432/BASE?sslmode=require
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: JPA_DDL_AUTO
        value: update
      - key: JPA_SHOW_SQL
        value: "false"
      - key: FLYWAY_ENABLED
        value: "false"
      - key: SEED_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true   # secreto propio de este servicio; no reemplazar por uno publicado
      - key: JWT_EXPIRATION
        value: "28800000"     # sesion del panel: 8 horas
      - key: ADMIN_REGISTRO_CODIGO
        sync: false   # codigo para registrar administradores (vacio = registro cerrado)
      - key: ADMIN_INICIAL_CORREO
        sync: false   # opcional: cuenta de administrador inicial (se crea una vez)
      - key: ADMIN_INICIAL_CLAVE
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false   # https://deep-service-frontend.onrender.com
      - key: PORT
        value: "8080"

  # --------------------------------------------------------------------
  # 2) Frontend: SPA estatico (React + Vite)
  # --------------------------------------------------------------------
  - type: web
    name: deep-service-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:spa
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false   # https://deep-service-backend.onrender.com
    routes:
      # El SPA usa React Router: toda ruta desconocida vuelve al index.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Cabeceras de seguridad para todo el sitio.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Solo se carga lo propio, la API en Render y el mapa de Google de la pagina de contacto.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self' data:; connect-src 'self' https://*.onrender.com; frame-src https://www.google.com https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      # JS/CSS de Vite: el nombre lleva hash, se puede cachear para siempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Videos e imágenes: 30 días. Quien vuelve al sitio no los descarga de
      # nuevo, y eso no consume ancho de banda de Render. (Si se reemplaza un
      # archivo, conviene cambiarle el nombre para que se vea de inmediato.)
      - path: /video/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /img/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /marcas/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /marca/*
        name: Cache-Control
        value: public, max-age=2592000
